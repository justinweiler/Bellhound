name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            script: sh scripts/package-unix.sh x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
            script: sh scripts/package-unix.sh x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
            script: sh scripts/package-unix.sh aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            script: powershell -File scripts/package-windows.ps1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v7
        with:
          name: bellhound-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
