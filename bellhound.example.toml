[credentials]
api_key_env = "TELNYX_API_KEY"
keyring_service = "Telnyx API key"
keyring_account = "your-account"

[relay]
# Bellhound only binds to loopback. Put a WSS tunnel or reverse proxy in front.
bind = "127.0.0.1:8787"
# This second listener is never placed behind the public tunnel.
control_bind = "127.0.0.1:8788"
path = "/conversation-relay"
webhook_path = "/webhooks/telnyx"
token_env = "BELLHOUND_RELAY_TOKEN"
max_call_seconds = 300
emit_partial_transcripts = false
continuation_window_ms = 900

[protocol]
max_speak_chars = 2000

[acknowledgement]
enabled = true
delay_ms = 500
mode = "speech"
sound_url = "https://raw.githubusercontent.com/justinweiler/Bellhound-Sounds/master/bellhound-thinking.mp3"
text = "Got it. Give me a moment."
suppress_phrases = [
  "thank you",
  "thanks",
  "bye",
  "goodbye",
  "good night",
  "goodnight",
  "love you",
]
suppress_for_session_phrases = [
  "call has been forwarded to an automated voice messaging system",
  "the person you are trying to reach is not available",
]

