[package]
name = "bellhound"
version = "0.6.3"
edition = "2024"
description = "A line-oriented telephone bridge for interactive AI agents"
license = "MIT"
readme = "README.md"
repository = "https://github.com/justinweiler/Bellhound"
homepage = "https://github.com/justinweiler/Bellhound"
keywords = ["voice", "telephone", "agents", "jsonl", "telnyx"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
keyring = "4.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.9.0", default-features = false, features = ["macros", "server", "transport-io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4"] }
zeroize = { version = "1.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3.0"
tungstenite = "0.29"
